[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrd-toolkit"
# 版本号唯一出处 = src/xrd_toolkit/__init__.py 的 __version__（2026-10-03
# 改成动态读：以前这里和「关于」对话框会各写一份，迟早对不上）
dynamic = ["version"]
description = "Modular Python toolkit for 2D X-ray diffraction analysis: calibration, azimuthal integration, background subtraction, peak finding, profile fitting and full-pattern refinement"
readme = "README.md"
requires-python = ">=3.9"
# PySide6 是 GUI 的主依赖（2026-10-03 补：以前漏了，只有开发机的手工
# conda 环境装着它——陌生人 pip install 完根本起不来界面）。
# pymatgen 2026-10-30 起也是主依赖：精修/物相/原位三个 GUI 工作台都要
# 读 CIF、算结构因子；以前只在 [simulation] 里，下载的 app 点不开它们。
dependencies = ["numpy", "scipy", "matplotlib", "fabio", "pyfai", "PySide6",
                "pymatgen"]

# 兼容旧安装命令：pymatgen 已在主依赖里，这个 extra 保留为别名。
[project.optional-dependencies]
simulation = ["pymatgen"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "xrd_toolkit.__version__"}
