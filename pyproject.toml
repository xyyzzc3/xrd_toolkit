[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrd-toolkit"
version = "0.1.0"
description = "Modular Python toolkit for 2D X-ray diffraction analysis: ring-center localization, LaB6 geometric calibration, azimuthal integration, sector analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "matplotlib", "fabio", "pyfai"]

[tool.setuptools.packages.find]
where = ["src"]
