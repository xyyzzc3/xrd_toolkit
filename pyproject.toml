[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrd-toolkit"
# 版本号唯一出处 = src/xrd_toolkit/__init__.py 的 __version__（2026-10-03
# 改成动态读：以前这里和「关于」对话框会各写一份，迟早对不上）
dynamic = ["version"]
description = "Modular Python toolkit for 2D X-ray diffraction analysis: ring-center localization, LaB6 geometric calibration, azimuthal integration, sector analysis"
readme = "README.md"
requires-python = ">=3.9"
# PySide6 是 GUI 的主依赖（2026-10-03 补：以前漏了，只有开发机的手工
# conda 环境装着它——陌生人 pip install 完根本起不来界面）
dependencies = ["numpy", "scipy", "matplotlib", "fabio", "pyfai", "PySide6"]

# 模拟模块（xrd_toolkit.simulation，RY04 第六周并入）需要 pymatgen；
# 主程序不依赖它：不装也能正常用，装上才有模拟功能。
[project.optional-dependencies]
simulation = ["pymatgen"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "xrd_toolkit.__version__"}
